<svg viewBox="0 0 480 280" xmlns="http://www.w3.org/2000/svg" width="480" height="280">
  <!-- Offset shadow for icon box -->
  <rect x="48" y="28" width="160" height="160" rx="24" fill="#1A1A3E"/>
  <!-- Main icon box -->
  <rect x="40" y="20" width="160" height="160" rx="24" fill="#FFE033" stroke="#1A1A3E" stroke-width="4"/>

  <!-- Scale: vertical pole -->
  <rect x="118" y="44" width="5" height="96" rx="2.5" fill="#1A1A3E"/>
  <!-- Scale: top beam -->
  <rect x="72" y="46" width="97" height="7" rx="3.5" fill="#1A1A3E"/>
  <!-- Scale: left arm -->
  <line x1="76" y1="50" x2="76" y2="84" stroke="#1A1A3E" stroke-width="4" stroke-linecap="round"/>
  <!-- Scale: right arm -->
  <line x1="165" y1="50" x2="165" y2="70" stroke="#1A1A3E" stroke-width="4" stroke-linecap="round"/>
  <!-- Scale: left pan -->
  <ellipse cx="76" cy="91" rx="22" ry="8" fill="#FF4D4D" stroke="#1A1A3E" stroke-width="3"/>
  <!-- Scale: right pan (higher – unbalanced, playful) -->
  <ellipse cx="165" cy="77" rx="22" ry="8" fill="#FF4D4D" stroke="#1A1A3E" stroke-width="3"/>
  <!-- Scale: base -->
  <rect x="108" y="136" width="26" height="8" rx="4" fill="#1A1A3E"/>
  <rect x="96" y="142" width="50" height="7" rx="3.5" fill="#1A1A3E"/>

  <!-- THE text -->
  <text x="228" y="108" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="900" fill="#1A1A3E" letter-spacing="-2">THE</text>
  <!-- PACT text -->
  <text x="224" y="174" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="900" fill="#FF4D4D" letter-spacing="-2">PACT</text>

  <!-- Divider line -->
  <line x1="224" y1="118" x2="456" y2="118" stroke="#1A1A3E" stroke-width="2" opacity="0.15"/>

  <!-- Tagline -->
  <text x="226" y="210" font-family="'Courier New', Courier, monospace" font-size="13" fill="#1A1A3E" opacity="0.5" letter-spacing="0.1em">A BINDING COVENANT</text>
</svg>
