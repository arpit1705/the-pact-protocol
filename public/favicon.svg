<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" width="512" height="512">
  <!-- Offset shadow -->
  <rect x="24" y="24" width="488" height="488" rx="112" fill="#1A1A3E"/>
  <!-- Main box -->
  <rect x="0" y="0" width="488" height="488" rx="112" fill="#FFE033" stroke="#1A1A3E" stroke-width="20"/>

  <!-- Vertical pole -->
  <rect x="234" y="72" width="22" height="320" rx="11" fill="#1A1A3E"/>
