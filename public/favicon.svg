  <rect x="92" y="80" width="312" height="28" rx="14" fill="#1A1A3E"/>
  <!-- Left arm -->
  <line x1="108" y1="94" x2="108" y2="218" stroke="#1A1A3E" stroke-width="18" stroke-linecap="round"/>
  <!-- Right arm -->
  <line x1="388" y1="94" x2="388" y2="170" stroke="#1A1A3E" stroke-width="18" stroke-linecap="round"/>
  <!-- Left pan -->
  <ellipse cx="108" cy="242" rx="84" ry="30" fill="#FF4D4D" stroke="#1A1A3E" stroke-width="16"/>
  <!-- Right pan (higher) -->
  <ellipse cx="388" cy="194" rx="84" ry="30" fill="#FF4D4D" stroke="#1A1A3E" stroke-width="16"/>
  <!-- Base stem -->
  <rect x="212" y="384" width="64" height="28" rx="14" fill="#1A1A3E"/>
